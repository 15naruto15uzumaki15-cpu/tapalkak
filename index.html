<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тапай Артема 100</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1a5c2a, #0d3317);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  h1 {
    font-size: 1.7rem;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    text-align: center;
  }

  .subtitle {
    font-size: 0.9rem;
    opacity: 0.85;
    margin-bottom: 15px;
    text-align: center;
  }

  .top-panel {
    display: flex;
    gap: 15px;
    margin-bottom: 10px;
  }

  .counter, .timer {
    font-size: 1.4rem;
    font-weight: bold;
    background: rgba(0,0,0,0.35);
    padding: 8px 20px;
    border-radius: 50px;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    text-align: center;
  }

  .timer {
    color: #ffd700;
    min-width: 130px;
  }

  .progress-bar {
    width: 260px;
    height: 14px;
    background: rgba(0,0,0,0.4);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7dff7d, #ffd700);
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px rgba(125,255,125,0.6);
  }

  .cucumber-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Стили для картинки */
  #target-img {
    width: 240px;
    height: 240px;
    object-fit: cover;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    border: 4px solid rgba(255,255,255,0.2);
    display: inline-block;
    z-index: 5;
    -webkit-user-drag: none;
  }

  #target-img:active {
    transform: scale(0.85);
  }

  .shake {
    animation: shake 0.25s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-8px) rotate(-5deg); }
    50% { transform: translateX(8px) rotate(5deg); }
    75% { transform: translateX(-5px) rotate(-3deg); }
  }

  /* Вылетающие надписи */
  .float-text {
    position: fixed;
    font-size: 1.1rem;
    font-weight: 900;
    color: #b6ff6b;
    text-shadow: 0 0 8px #2d7a00, 2px 2px 0 #000;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    animation: floatUp 1.1s ease-out forwards;
  }

  @keyframes floatUp {
    0% {
      transform: translate(0, 0) scale(0.6) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
      opacity: 0;
    }
  }

  /* Взрыв */
  .explosion {
    position: absolute;
    font-size: 200px;
    animation: boom 0.9s ease forwards;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes boom {
    0% { transform: scale(0.3); opacity: 1; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  #result {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.3) rotate(-10deg);
    font-size: 2.4rem;
    font-weight: 900;
    color: #ff2d2d;
    text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 3px 3px 0 #000;
    text-align: center;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
  }

  #result.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1) rotate(-5deg);
  }

  .reset-btn {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 1.1rem;
    font-weight: bold;
    background: #ffd700;
    color: #1a5c2a;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 5px 0 #b89600, 0 8px 20px rgba(0,0,0,0.4);
    transition: all 0.1s;
    display: none;
    z-index: 20;
    position: relative;
  }

  .reset-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #b89600, 0 4px 10px rgba(0,0,0,0.4);
  }

  .reset-btn.visible {
    display: block;
  }

  /* Лидерборд */
  .leaderboard {
    margin-top: 25px;
    width: 100%;
    max-width: 340px;
    background: rgba(0,0,0,0.35);
    border-radius: 16px;
    padding: 15px 20px;
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 20;
    position: relative;
  }

  .leaderboard h2 {
    font-size: 1.2rem;
    margin-bottom: 12px;
    text-align: center;
    color: #ffd700;
  }

  .leaderboard ol {
    list-style: none;
  }

  .leaderboard li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 5px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 1rem;
  }

  .leaderboard li:last-child {
    border-bottom: none;
  }

  .rank {
    margin-right: 8px;
    color: #ffd700;
    font-weight: bold;
    min-width: 22px;
  }

  .leaderboard .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 10px;
  }

  .leaderboard .score {
    font-weight: bold;
    color: #aaffaa;
  }

  .empty-board {
    text-align: center;
    opacity: 0.6;
    font-style: italic;
    font-size: 0.9rem;
    padding: 10px;
    justify-content: center !important;
  }

  /* Фейерверк */
  #fireworksCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 150;
  }
</style>
</head>
<body>

<canvas id="fireworksCanvas"></canvas>

<h1>Тапай Артема!</h1>
<p class="subtitle">Цель — 100 тапов! Побей рекорд по скорости 🔥</p>

<div class="top-panel">
  <div class="counter" id="counter">Тапов: 0 / 100</div>
  <div class="timer" id="timer">00:00.00</div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="cucumber-wrap">
  <!-- Убедитесь, что файл называется artem.jpg и лежит рядом -->
  <img id="target-img" src="artem.jpg" alt="Артем" draggable="false">
</div>

<div id="result">Артем пидор</div>

<button class="reset-btn" id="resetBtn">Заново</button>

<div class="leaderboard">
  <h2>🏆 Лидерборд (по скорости)</h2>
  <ol id="leaderboardList"></ol>
</div>

<script>
  const targetImg = document.getElementById('target-img');
  const counterEl = document.getElementById('counter');
  const timerEl = document.getElementById('timer');
  const progressFill = document.getElementById('progressFill');
  const resultEl = document.getElementById('result');
  const resetBtn = document.getElementById('resetBtn');
  const leaderboardList = document.getElementById('leaderboardList');

  const MAX_TAPS = 100;
  let taps = 0;
  let exploded = false;
  
  // Таймер
  let startTime = null;
  let timerInterval = null;
  let finalTime = 0;

  // ===== Лидерборд =====
  let leaderboard = JSON.parse(localStorage.getItem('artemLeaderboard100') || '[]');

  function formatTime(ms) {
    if (ms === 0) return '00:00.00';
    const totalSec = ms / 1000;
    const min = Math.floor(totalSec / 60);
    const sec = Math.floor(totalSec % 60);
    const msStr = Math.floor((totalSec % 1) * 100).toString().padStart(2, '0');
    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${msStr}`;
  }

  function renderLeaderboard() {
    leaderboardList.innerHTML = '';
    if (leaderboard.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty-board';
      li.textContent = 'Пока нет результатов';
      leaderboardList.appendChild(li);
      return;
    }
    leaderboard.forEach((entry, i) => {
      const li = document.createElement('li');
      const rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = (i + 1) + '.';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      const score = document.createElement('span');
      score.className = 'score';
      score.textContent = formatTime(entry.time);
      li.appendChild(rank);
      li.appendChild(name);
      li.appendChild(score);
      leaderboardList.appendChild(li);
    });
  }

  function addToLeaderboard(timeMs) {
    const name = prompt('ЦЕЛЬ ДОСТИГНУТА! 🎆\nВаше время: ' + formatTime(timeMs) + '\nВведи своё имя для лидерборда:', 'Игрок');
    if (name && name.trim()) {
      leaderboard.push({ name: name.trim().slice(0, 20), time: timeMs });
      // Сортировка по времени: кто быстрее, тот выше
      leaderboard.sort((a, b) => a.time - b.time);
      leaderboard = leaderboard.slice(0, 10);
      localStorage.setItem('artemLeaderboard100', JSON.stringify(leaderboard));
      renderLeaderboard();
    }
  }

  // ===== Таймер =====
  function startTimer() {
    if (startTime !== null) return;
    startTime = performance.now();
    timerInterval = setInterval(() => {
      const elapsed = performance.now() - startTime;
      timerEl.textContent = formatTime(elapsed);
    }, 10);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
    finalTime = performance.now() - startTime;
    timerEl.textContent = formatTime(finalTime);
  }

  // ===== Вылетающие надписи "Артем чмо" =====
  function spawnFloatingText(x, y) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = 'Артем чмо';
    document.body.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 120;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 60; 
    const rot = (Math.random() * 60 - 30) + 'deg';

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--tx', tx + 'px');
    el.style.setProperty('--ty', ty + 'px');
    el.style.setProperty('--rot', rot);

    const colors = ['#b6ff6b', '#ffd700', '#7dff7d', '#ffffff', '#aaffaa', '#ffef7d'];
    el.style.color = colors[Math.floor(Math.random() * colors.length)];

    setTimeout(() => el.remove(), 1150);
  }

  // ===== Фейерверк =====
  const canvas = document.getElementById('fireworksCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fireworksActive = false;
  let animationId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function createFirework(x, y) {
    const colors = ['#ff2d2d', '#ffd700', '#7dff7d', '#4fc3f7', '#ff69b4', '#ffffff', '#ffa500', '#b6ff6b'];
    const baseColor = colors[Math.floor(Math.random() * colors.length)];
    const count = 60 + Math.floor(Math.random() * 40);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 2 + Math.random() * 5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.008 + Math.random() * 0.012,
        color: Math.random() < 0.5 ? baseColor : colors[Math.floor(Math.random() * colors.length)],
        size: 1.5 + Math.random() * 2.5
      });
    }
  }

  function animateFireworks() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.life -= p.decay;

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = Math.max(0, p.life * 0.3);
      ctx.beginPath();
      ctx.arc(p.x - p.vx * 2, p.y - p.vy * 2, p.size * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;

    if (particles.length > 0) {
      animationId = requestAnimationFrame(animateFireworks);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fireworksActive = false;
      animationId = null;
    }
  }

  function startFireworks(duration = 6000) {
    if (!fireworksActive) {
      fireworksActive = true;
      animateFireworks();
    }
    const startTime = Date.now();
    function launch() {
      if (Date.now() - startTime > duration) return;
      const x = canvas.width * (0.15 + Math.random() * 0.7);
      const y = canvas.height * (0.1 + Math.random() * 0.5);
      createFirework(x, y);
      setTimeout(launch, 200 + Math.random() * 300);
    }
    launch();
  }

  // ===== Взрыв =====
  function explode() {
    exploded = true;
    targetImg.style.visibility = 'hidden';
    stopTimer();

    const boom = document.createElement('div');
    boom.className = 'explosion';
    boom.textContent = '💥';
    document.querySelector('.cucumber-wrap').appendChild(boom);
    setTimeout(() => boom.remove(), 900);

    resultEl.classList.add('show');
    startFireworks(7000);
    resetBtn.classList.add('visible');

    setTimeout(() => addToLeaderboard(finalTime), 1200);
  }

  function reset() {
    taps = 0;
    exploded = false;
    startTime = null;
    finalTime = 0;
    if (timerInterval) clearInterval(timerInterval);
    
    counterEl.textContent = 'Тапов: 0 / ' + MAX_TAPS;
    timerEl.textContent = '00:00.00';
    progressFill.style.width = '0%';
    targetImg.style.visibility = 'visible';
    resultEl.classList.remove('show');
    resetBtn.classList.remove('visible');
    
    particles = [];
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
      fireworksActive = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // ===== Клик =====
  targetImg.addEventListener('click', (e) => {
    if (exploded) return;

    if (taps === 0) {
      startTimer();
    }

    taps++;
    counterEl.textContent = 'Тапов: ' + taps + ' / ' + MAX_TAPS;
    progressFill.style.width = (taps / MAX_TAPS * 100) + '%';

    targetImg.classList.remove('shake');
    void targetImg.offsetWidth;
    targetImg.classList.add('shake');

    const rect = targetImg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    
    const count = 2 + Math.floor(Math.random() * 2); 
    for (let i = 0; i < count; i++) {
      spawnFloatingText(
        cx + (Math.random() * 60 - 30),
        cy + (Math.random() * 60 - 30)
      );
    }

    if (taps >= MAX_TAPS) {
      explode();
    }
  });

  resetBtn.addEventListener('click', reset);

  // Инициализация
  renderLeaderboard();
</script>

</body>
</html>
